<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pong</title>

    <style>
        body{
            margin: 0;
            overflow: hidden;
            background: rgb(12, 12, 12);
            
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        canvas{
            display: block;
            background-color: rgb(87, 84, 90);
        }

                /* Estilo do botão  o # é pra selecionar pelo id*/ 
        #btnUsuarios {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            z-index: 10;
        }

        #btnUsuarios:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <canvas id="tela"></canvas>
    
    <button id="btnUsuarios">Usuarios conectados</button>

    <script src="script.js"></script>



</body>
</html>
